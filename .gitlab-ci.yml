# Every job here is a thin wrapper around a script you can run yourself:
#
#   bash scripts/check.sh
#
# That is deliberate. With no runner attached these pipelines sit pending, and
# the checks still have to happen, so they live in the repo rather than in this
# file. Attach a runner later and nothing needs rewriting.

stages:
  - validate

validate:structure:
  stage: validate
  image: python:3.12-slim
  script:
    - bash scripts/check.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

# Deeper validation with the Claude CLI. Kept manual because it needs npm on
# the runner; promote it to automatic once the image is warm. scripts/check.sh
# runs this step too whenever the CLI is on PATH, which it is on your machine.
validate:plugin:
  stage: validate
  image: node:22-slim
  when: manual
  allow_failure: true
  script:
    - npm install -g @anthropic-ai/claude-code
    - claude plugin validate .

# Release tags follow the convention `claude plugin tag` writes:
# <plugin-name>--v<version>, for example frends-companion-developer--v0.5.0.
# Both halves must match plugin.json, which catches a tag written by hand.
release:check:
  stage: validate
  image: python:3.12-slim
  script:
    - |
      tag_name="${CI_COMMIT_TAG%%--v*}"
      tag_version="${CI_COMMIT_TAG##*--v}"
      n=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['name'])")
      v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
      echo "tag=$CI_COMMIT_TAG  plugin.json: name=$n version=$v"
      [ "$tag_name" = "$n" ] \
        || { echo "ERROR: tag names plugin '$tag_name', plugin.json says '$n'"; exit 1; }
      [ "$tag_version" = "$v" ] \
        || { echo "ERROR: tag version $tag_version does not match plugin.json version $v"; exit 1; }
  rules:
    - if: $CI_COMMIT_TAG =~ /--v/

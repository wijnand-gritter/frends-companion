# Runs the same checks as scripts/check.sh and the pre-push hook.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Claude CLI for plugin validation
        run: npm install -g @anthropic-ai/claude-code
      - name: Checks
        run: bash scripts/check.sh
